<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Портфолио команды</title>
  <meta name="description" content="" />
  <meta name="theme-color" content="#07070c" />
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="is-loading">
  <!-- Прелоадер -->
  <div class="preloader" id="preloader">
    <div class="preloader__logo"><span data-brand>WIKS</span><i data-brand-accent>.team</i></div>
    <div class="preloader__bar"><span></span></div>
  </div>

  <!-- Фон -->
  <div class="bg" aria-hidden="true">
    <div class="bg__grid"></div>
    <div class="bg__blob bg__blob--1"></div>
    <div class="bg__blob bg__blob--2"></div>
    <div class="bg__blob bg__blob--3"></div>
    <div class="bg__noise"></div>
  </div>
  <div class="cursor-glow" aria-hidden="true"></div>
  <div class="progress" aria-hidden="true"><span></span></div>

  <!-- Шапка -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="#top" class="logo"><span class="logo__mark">&lt;/&gt;</span><span class="logo__text"><span data-brand>WIKS</span><i data-brand-accent>.team</i></span></a>
      <nav class="nav" id="nav"></nav>
      <div class="header__actions">
        <button class="btn btn--ghost btn--sm magnetic" id="loginBtn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          <span data-login-label>Вход</span>
        </button>
        <button class="burger" id="burger" aria-label="Меню"><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- HERO -->
    <section class="hero">
      <div class="container hero__inner">
        <div class="hero__content">
          <div class="badge reveal"><span class="badge__dot"></span><span data-t="hero.badge"></span></div>
          <h1 class="hero__title">
            <span class="line reveal"><span data-t="hero.titleTop"></span></span>
            <span class="line reveal"><span class="rotator" id="rotator"></span></span>
            <span class="line line--muted reveal" data-t="hero.titleBottom"></span>
          </h1>
          <p class="hero__subtitle reveal" data-t="hero.subtitle"></p>
          <div class="hero__cta reveal">
            <a href="#works" class="btn btn--primary magnetic"><span data-t="hero.ctaPrimary"></span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 5l7 7-7 7"/></svg></a>
            <a href="#contact" class="btn btn--ghost magnetic"><span data-t="hero.ctaSecondary"></span></a>
          </div>
        </div>
        <div class="hero__visual reveal">
          <div class="code-card tilt">
            <div class="code-card__top"><i></i><i></i><i></i><span>team.config.ts</span></div>
            <pre class="code-card__body"><code id="typed"></code><span class="caret"></span></pre>
          </div>
          <div class="float-chip float-chip--1">🤖 bot.online</div>
          <div class="float-chip float-chip--2">⚡ 42ms API</div>
          <div class="float-chip float-chip--3">🕷️ 1.2M rows</div>
        </div>
      </div>
      <div class="container">
        <div class="stats" id="stats"></div>
      </div>
      <a href="#about" class="scroll-hint" aria-label="Листать вниз"><span></span></a>
    </section>

    <!-- О НАС -->
    <section class="section" id="about">
      <div class="container about">
        <div class="about__head">
          <div class="eyebrow reveal" data-t="about.eyebrow"></div>
          <h2 class="section__title reveal" data-t="about.title"></h2>
        </div>
        <div class="about__text reveal" id="aboutText"></div>
        <div class="about__points" id="aboutPoints"></div>
      </div>
    </section>

    <!-- Бегущая строка -->
    <div class="marquee" aria-hidden="true"><div class="marquee__track" id="marquee"></div></div>

    <!-- УСЛУГИ -->
    <section class="section" id="services">
      <div class="container">
        <div class="eyebrow reveal" data-t="services.eyebrow"></div>
        <h2 class="section__title reveal" data-t="services.title"></h2>
        <div class="services" id="servicesGrid"></div>
      </div>
    </section>

    <!-- ПРОЦЕСС -->
    <section class="section" id="process">
      <div class="container">
        <div class="eyebrow reveal" data-t="process.eyebrow"></div>
        <h2 class="section__title reveal" data-t="process.title"></h2>
        <div class="timeline" id="timeline"><div class="timeline__line"><span></span></div></div>
      </div>
    </section>

    <!-- РАБОТЫ -->
    <section class="section" id="works">
      <div class="container">
        <div class="works__head">
          <div>
            <div class="eyebrow reveal" data-t="works.eyebrow"></div>
            <h2 class="section__title reveal" data-t="works.title"></h2>
            <p class="section__subtitle reveal" data-t="works.subtitle"></p>
          </div>
        </div>
        <div class="toolbar reveal">
          <div class="chips" id="chips"><span class="chips__indicator"></span></div>
          <div class="toolbar__right">
            <label class="search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input id="search" type="search" placeholder="Поиск..." />
            </label>
            <div class="select">
              <select id="sort">
                <option value="new">Сначала новые</option>
                <option value="old">Сначала старые</option>
                <option value="az">По алфавиту</option>
                <option value="featured">Избранные</option>
              </select>
            </div>
          </div>
        </div>
        <div class="works" id="worksGrid"></div>
        <p class="works__empty" id="worksEmpty" hidden></p>
      </div>
    </section>

    <!-- КОНТАКТЫ -->
    <section class="section" id="contact">
      <div class="container">
        <div class="cta reveal">
          <div class="cta__glow"></div>
          <div class="eyebrow" data-t="contact.eyebrow"></div>
          <h2 class="cta__title" data-t="contact.title"></h2>
          <p class="cta__text" data-t="contact.text"></p>
          <a class="btn btn--primary btn--lg magnetic" id="ctaBtn" target="_blank" rel="noopener"><span data-t="contact.buttonText"></span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17L17 7M8 7h9v9"/></svg></a>
          <div class="cta__links" id="contactLinks"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer"><div class="container footer__inner"><span data-t="footer.text"></span><a href="#top" class="to-top">Наверх ↑</a></div></footer>

  <!-- Модалка работы -->
  <div class="modal" id="projectModal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog modal__dialog--wide" role="dialog" aria-modal="true">
      <button class="modal__close" data-close aria-label="Закрыть">×</button>
      <div class="project" id="projectBody"></div>
    </div>
  </div>

  <!-- Модалка входа -->
  <div class="modal" id="loginModal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog modal__dialog--sm" role="dialog" aria-modal="true">
      <button class="modal__close" data-close aria-label="Закрыть">×</button>
      <form class="login" id="loginForm">
        <div class="login__icon">🔐</div>
        <h3>Вход в админку</h3>
        <p class="muted">Только для команды</p>
        <label class="field"><span>Email</span><input type="email" name="email" autocomplete="username" required /></label>
        <label class="field"><span>Пароль</span><input type="password" name="password" autocomplete="current-password" required /></label>
        <p class="login__error" id="loginError"></p>
        <button class="btn btn--primary btn--block" type="submit"><span>Войти</span></button>
      </form>
    </div>
  </div>

  <script src="/js/app.js" defer></script>
</body>
</html>
